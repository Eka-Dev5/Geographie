<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Géographie Master 🌍</title>
<style>
/* ═══════════════════════════════════════════
   🎨 IDENTITÉ VISUELLE GÉOGRAPHIE
   ═══════════════════════════════════════════ */
:root {
  --primary:#27ae60; --secondary:#229954; --success:#48bb78;
  --error:#f56565; --warning:#ed8936; --bg:#f7fafc; --text:#2d3748;
  --shadow:0 10px 30px rgba(0,0,0,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,sans-serif}
body{background:linear-gradient(135deg,var(--primary),var(--secondary));min-height:100vh;padding:15px}

/* MISE EN PAGE IDENTIQUE À TON MODÈLE */
.quiz-container{background:white;width:100%;max-width:820px;margin:0 auto;border-radius:20px;padding:25px;box-shadow:var(--shadow)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #f0f2f5}
.btn{padding:10px 22px;border:none;border-radius:12px;cursor:pointer;font-weight:700;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--primary);color:white}
.option-btn{width:100%;text-align:left;padding:16px 20px;margin-bottom:12px;border:2px solid #edf2f7;border-radius:15px;background:white;font-size:1.05em;cursor:pointer}
.option-btn:hover{border-color:var(--primary);background:#f0fff4}
.lesson-card{background:#f0fff4;border-left:5px solid var(--primary);padding:20px;border-radius:12px;margin-bottom:25px;line-height:1.6}
</style>
</head>
<body>

<div class="quiz-container">
  <div class="header">
    <div>
      <h1>🌍 Géographie Master</h1>
      <div style="color:var(--secondary); font-weight:bold; font-size:0.9em">👤 Joueur : <span id="playerNameDisplay">-</span></div>
    </div>
    <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">📊 Stats</button>
  </div>

  <div id="setup-screen">
    <div class="lesson-card" id="lesson-box">
      <h2 id="lesson-title" style="color:var(--primary)">Chargement...</h2>
      <div id="lesson-content" style="margin-top:10px"></div>
    </div>
    <div id="level-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:15px"></div>
  </div>

  <div id="quiz-screen" style="display:none">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px">
      <span id="progress-text" style="font-weight:bold; color:var(--primary)"></span>
      <span id="timer-text" style="color:var(--error); font-weight:bold">⏳ 20s</span>
    </div>
    <h2 id="question-text" style="margin-bottom:20px"></h2>
    <div id="options-container"></div>
  </div>

  <div id="result-screen" style="display:none; text-align:center">
    <h2 id="result-title" style="font-size:2em">Résultat</h2>
    <div id="result-score" style="font-size:4em; font-weight:900; color:var(--primary)">0/0</div>
    <p id="result-msg" style="margin:20px 0"></p>
    <button class="btn btn-primary" onclick="location.reload()">🏠 Retour</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   🎯 INJECTION DE TON BLOC GÉOGRAPHIE COMPLET (200 QUESTIONS)
   ═══════════════════════════════════════════════════════════════════ */

const SUBJECT_CONFIG = {
  storageKey: 'geoMaster_v1',
  playersKey: 'geoMaster_players',
  subjectName: 'Géographie Master'
};

// Ici, j'injecte les leçons de ton fichier geo_master_bloc_complet.js
const LESSONS_DATA = {
  1: { title: "Niveau 1 : La France - Territoire et Population", content: "La France est le pays le plus vaste de l'Union européenne... (etc)" },
  2: { title: "Niveau 2 : Milieux, Reliefs et Climats", content: "Le territoire français est marqué par une grande diversité de reliefs... (etc)" },
  3: { title: "Niveau 3 : Aménager le territoire", content: "Aménager le territoire, c'est réduire les inégalités entre les régions... (etc)" },
  4: { title: "Niveau 4 : La France dans l'Union Européenne", content: "La France est un membre fondateur de l'UE... (etc)" },
  5: { title: "Niveau 5 : La France et le Monde", content: "La France dispose du 2ème domaine maritime mondial... (etc)" }
};

// C'est ici que tes 200 questions de ton fichier JS sont placées
// (Je ne mets que le début pour l'exemple, mais tu dois y coller tout ton tableau QUESTIONS_DB_GEO)
const QUESTIONS_DATA = [
    { level: 1, question: "Quel est le pays le plus vaste de l'Union européenne ?", options: ["Allemagne", "France", "Espagne", "Suède"], answer: "France", explanation: "Avec 550 000 km², la France métropolitaine est le plus grand pays de l'UE." },
    // ... COLLE ICI TOUTES LES QUESTIONS DE TON FICHIER geo_master_bloc_complet.js ...
];

/* ═══════════════════════════════════════════
   🚀 MOTEUR TECHNIQUE (TEMPLATE HISTOIRE)
   ═══════════════════════════════════════════ */
let currentPlayerName = "";
let currentLevel = 0;
let score = 0;
let qIdx = 0;
let sessionQuestions = [];

function getPlayers() { return JSON.parse(localStorage.getItem(SUBJECT_CONFIG.playersKey)) || {}; }
function savePlayers(p) { localStorage.setItem(SUBJECT_CONFIG.playersKey, JSON.stringify(p)); }

function init() {
  const players = getPlayers();
  const params = new URLSearchParams(window.location.search);
  const urlPlayer = params.get('player');

  // Système de gestion des joueurs identique à Histoire
  if (urlPlayer && players[urlPlayer]) {
    currentPlayerName = urlPlayer;
  } else {
    const names = Object.keys(players);
    if (names.length > 0) {
      currentPlayerName = names[0];
    } else {
      currentPlayerName = "Joueur 1";
      players[currentPlayerName] = { name: "Joueur 1", currentLevel: 1, score: 0, completed: [], totalQuestions: 0, totalCorrect: 0, streak: 0, errorHistory: [] };
      savePlayers(players);
    }
  }
  document.getElementById('playerNameDisplay').textContent = currentPlayerName;
  renderLevels();
}

function renderLevels() {
  const grid = document.getElementById('level-grid');
  grid.innerHTML = "";
  const p = getPlayers()[currentPlayerName];
  // Boucle i <= 5 car tu as 5 niveaux dans ton bloc Géo
  for (let i = 1; i <= 5; i++) {
    const isLocked = i > p.currentLevel;
    const btn = document.createElement('button');
    btn.className = `btn ${isLocked ? 'btn-locked' : 'btn-primary'}`;
    btn.style.opacity = isLocked ? "0.5" : "1";
    btn.innerHTML = `Niveau ${i} ${p.completed.includes(i) ? '✅' : ''}`;
    btn.onclick = () => { if(!isLocked) showLesson(i); };
    grid.appendChild(btn);
  }
}

function showLesson(lvl) {
  currentLevel = lvl;
  const lesson = LESSONS_DATA[lvl];
  document.getElementById('lesson-title').textContent = lesson.title;
  document.getElementById('lesson-content').innerHTML = `<p>${lesson.content}</p><br><button class="btn btn-primary" onclick="startQuiz()">🔥 Commencer le Quiz</button>`;
}

function startQuiz() {
  sessionQuestions = QUESTIONS_DATA.filter(q => q.level === currentLevel).sort(() => 0.5 - Math.random()).slice(0, 10);
  score = 0; qIdx = 0;
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  displayQuestion();
}

function displayQuestion() {
  const q = sessionQuestions[qIdx];
  document.getElementById('progress-text').textContent = `Question ${qIdx + 1}/10`;
  document.getElementById('question-text').textContent = q.question;
  const container = document.getElementById('options-container');
  container.innerHTML = "";
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = opt;
    b.onclick = () => {
      if(opt === q.answer) score++;
      qIdx++;
      if(qIdx < 10) displayQuestion(); else finish();
    };
    container.appendChild(b);
  });
}

function finish() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('result-score').textContent = `${score}/10`;
  
  if (score >= 8) {
    const players = getPlayers();
    const p = players[currentPlayerName];
    if (!p.completed.includes(currentLevel)) p.completed.push(currentLevel);
    if (currentLevel === p.currentLevel && p.currentLevel < 5) p.currentLevel++;
    savePlayers(players);
    document.getElementById('result-msg').textContent = "Bravo ! Niveau validé !";
  } else {
    document.getElementById('result-msg').textContent = "Retente ta chance pour obtenir 8/10 !";
  }
}

init();
</script>
</body>
</html>
