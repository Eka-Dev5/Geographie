<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Géographie Master 🌍</title>
<style>
:root {
  --primary:#27ae60; --secondary:#229954; --success:#48bb78;
  --error:#f56565; --warning:#ed8936; --bg:#f7fafc; --text:#2d3748;
  --shadow:0 10px 30px rgba(0,0,0,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,sans-serif}
body{background:linear-gradient(135deg,var(--primary),var(--secondary));min-height:100vh;padding:15px}
.quiz-container{background:white;width:100%;max-width:820px;margin:0 auto;border-radius:20px;padding:25px;box-shadow:var(--shadow);position:relative}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #e2e8f0;flex-wrap:wrap;gap:10px}
.player-info{display:flex;align-items:center;gap:12px;cursor:pointer;padding:5px 10px;border-radius:12px;transition:0.2s}
.player-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;display:flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:bold}
.player-name{font-weight:700;color:var(--text);font-size:1.1em}
.header-score{background:var(--bg);padding:8px 15px;border-radius:12px;font-weight:800;color:var(--primary);border:1px solid #e2e8f0}
.section{display:none;animation:fadeIn 0.4s ease-out}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.home-title{text-align:center;font-size:2.2em;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.levels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px;margin-top:20px}
.level-card{background:#fff;border:2px solid #e2e8f0;border-radius:18px;padding:20px;text-align:center;cursor:pointer;transition:0.3s}
.level-card:hover{border-color:var(--primary);transform:translateY(-3px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border:none;padding:12px 24px;border-radius:12px;cursor:pointer;font-weight:bold;width:100%;margin-top:10px}
.option-btn{display:block;width:100%;padding:15px;margin-bottom:10px;border:2px solid #e2e8f0;border-radius:12px;background:white;cursor:pointer;text-align:left;font-size:1.1em;transition:0.2s}
.option-btn:hover{border-color:var(--primary);background:#f0fff4}
.correct{background-color:var(--success) !important;color:white;border-color:var(--success) !important}
.wrong{background-color:var(--error) !important;color:white;border-color:var(--error) !important}
#feedback{margin-top:20px;padding:15px;border-radius:12px;display:none}
</style>
</head>
<body>

<div class="quiz-container">
  <div class="header">
    <div class="player-info" onclick="location.reload()">
      <div class="player-avatar">🌍</div>
      <div><div class="player-name" id="pName">Joueur</div><div id="pStats" style="font-size:0.8em;color:#718096">Niveau 1</div></div>
    </div>
    <div style="display:flex;gap:10px">
      <a href="dashboard.html" style="text-decoration:none;background:#edf2f7;padding:8px 12px;border-radius:10px;color:var(--text);font-weight:bold">📊 Espace</a>
      <div class="header-score" id="hScore">0 pts</div>
    </div>
  </div>

  <div id="sec-home" class="section active">
    <h1 class="home-title">Géographie Master 🌍</h1>
    <div id="levels-grid" class="levels-grid"></div>
  </div>

  <div id="sec-lesson" class="section">
    <h2 id="lesson-title" style="margin-bottom:15px;color:var(--primary)"></h2>
    <div id="lesson-content" style="line-height:1.6;margin-bottom:20px;background:#f8fafc;padding:20px;border-radius:15px"></div>
    <button class="btn-primary" onclick="startQuiz()">Commencer le Quiz</button>
  </div>

  <div id="sec-quiz" class="section">
    <div style="display:flex;justify-content:space-between;margin-bottom:15px;font-weight:bold;color:#718096">
      <span id="qIndex">Question 1/10</span>
      <span id="qTimer">00:00</span>
    </div>
    <div id="qText" style="font-size:1.3em;font-weight:bold;margin-bottom:20px;color:var(--text)"></div>
    <div id="options-container"></div>
    <div id="feedback"></div>
    <button id="btn-next" class="btn-primary" style="display:none" onclick="nextQuestion()">Question suivante</button>
  </div>
</div>

            {q: "___% des récifs coralliens sont menacés d'ici 2050.", answer: "50", alternatives: ["cinquante", "Cinquante"], explanation: "Acidification et réchauffement des océans."},
            {q: "Le Protocole de ___ (1987) a protégé la couche d'ozone.", answer: "Montréal", alternatives: ["montréal", "Montreal", "montreal"], explanation: "Interdiction des CFC, succès majeur."},
            {q: "L'Accord de ___ concerne le climat (2015).", answer: "Paris", alternatives: ["paris", "Paris"], explanation: "COP21."},
            {q: "L'___ est la forêt tropicale qui perd le plus d'arbres.", answer: "Amazonie", alternatives: ["amazonie", "Amazonie", "forêt amazonienne"], explanation: "Déforestation massive."},
            {q: "La ___ est le leader mondial de l'énergie solaire.", answer: "Chine", alternatives: ["chine", "Chine"], explanation: "Plus de 50% des panneaux solaires."},
            {q: "L'___ utilise la géothermie pour 90% de son chauffage.", answer: "Islande", alternatives: ["islande", "Islande"], explanation: "Énergie volcanique."},
            {q: "Le barrage des ___-Gorges est le plus puissant (22 500 MW).", answer: "Trois", alternatives: ["trois", "3", "Trois-Gorges", "trois-gorges"], explanation: "Chine, Yangtsé."},
            {q: "___% de la nourriture produite est gaspillée.", answer: "33", alternatives: ["trente-trois", "trente trois", "un tiers", "1/3"], explanation: "Un tiers perdu ou gaspillé."},
            {q: "___ milliards de personnes n'ont pas accès à l'eau potable sûre.", answer: "2,2", alternatives: ["2.2", "2,2", "deux virgule deux", "deux point deux"], explanation: "Stress hydrique mondial."},
            {q: "L'___ du niveau des mers menace les Maldives et Tuvalu.", answer: "élévation", alternatives: ["Élévation", "élévation", "remontée", "Remontée", "montée", "Montée"], explanation: "+3,4 mm/an."},
            {q: "L'___ est l'insecte pollinisateur en déclin (40% de colonies perdues).", answer: "abeille", alternatives: ["Abeille", "abeille", "abeilles", "Abeilles"], explanation: "Essentielle pour la pollinisation."},
            {q: "La COP___ (2023) a adopté la transition hors énergies fossiles.", answer: "28", alternatives: ["28", "vingt-huit", "vingt huit"], explanation: "COP28 à Dubaï."},
            {q: "Seulement ___% des terres agricoles sont en agriculture biologique.", answer: "2", alternatives: ["deux", "Deux"], explanation: "Très faible part mondiale."},
            {q: "Le rapport ___ (2019) alerte sur la 6e extinction de masse.", answer: "IPBES", alternatives: ["ipbes", "Ipbes"], explanation: "1 million d'espèces menacées."}
        ]
    }
};

// Moteur de jeu
let players = JSON.parse(localStorage.getItem(SUBJECT_CONFIG.playersKey)) || { "Joueur 1": { name:"Joueur 1", score:0, currentLevel:1, errorHistory:[] } };
let currentPlayer = players[Object.keys(players)[0]];
let currentLvl = 1;
let currentQIdx = 0;
let levelQuestions = [];
let scoreSession = 0;

function renderLevels() {
  const grid = document.getElementById('levels-grid');
  grid.innerHTML = '';
  for(let i=1; i<=5; i++) {
    const card = document.createElement('div');
    card.className = `level-card ${i > currentPlayer.currentLevel ? 'locked' : ''}`;
    card.innerHTML = `<div class="level-number">${i}</div><div class="level-label">Niveau</div>`;
    if(i <= currentPlayer.currentLevel) card.onclick = () => showLesson(i);
    grid.appendChild(card);
  }
}

function showLesson(lvl) {
  currentLvl = lvl;
  const lesson = LESSONS_DATA.find(l => l.lvl === lvl);
  document.getElementById('lesson-title').innerText = lesson.title;
  document.getElementById('lesson-content').innerText = lesson.content;
  showSection('sec-lesson');
}

function startQuiz() {
  levelQuestions = QUESTIONS_DB.filter(q => q.lvl === currentLvl).sort(() => 0.5 - Math.random()).slice(0, 10);
  currentQIdx = 0;
  scoreSession = 0;
  showSection('sec-quiz');
  showQuestion();
}

function showQuestion() {
  const q = levelQuestions[currentQIdx];
  document.getElementById('qIndex').innerText = `Question ${currentQIdx + 1}/10`;
  document.getElementById('qText').innerText = q.q;
  const cont = document.getElementById('options-container');
  cont.innerHTML = '';
  q.o.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(opt, q.a, q.exp);
    cont.appendChild(btn);
  });
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
}

function checkAnswer(choice, correct, exp) {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const feedback = document.getElementById('feedback');
  feedback.style.display = 'block';
  
  if(choice === correct) {
    feedback.innerHTML = `<b style="color:var(--success)">Bravo !</b> ${exp}`;
    scoreSession += 10;
  } else {
    feedback.innerHTML = `<b style="color:var(--error)">Erreur...</b> La réponse était : ${correct}. ${exp}`;
    currentPlayer.errorHistory.push({question: levelQuestions[currentQIdx].q, correctAnswer: correct});
  }
  document.getElementById('btn-next').style.display = 'block';
}

function nextQuestion() {
  currentQIdx++;
  if(currentQIdx < 10) showQuestion();
  else finishQuiz();
}

function finishQuiz() {
  alert(`Quiz terminé ! Score : ${scoreSession} pts`);
  currentPlayer.score += scoreSession;
  if(scoreSession >= 70 && currentLvl === currentPlayer.currentLevel) currentPlayer.currentLevel++;
  localStorage.setItem(SUBJECT_CONFIG.playersKey, JSON.stringify(players));
  location.reload();
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('pName').innerText = currentPlayer.name;
document.getElementById('hScore').innerText = currentPlayer.score + " pts";
renderLevels();
</script>
</body>
