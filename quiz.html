<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géographie Master | Le Jeu</title>
    <style>
        :root {
            --primary: #27ae60;
            --secondary: #2ecc71;
            --dark: #2d3436;
            --light: #f9f9f9;
            --error: #e74c3c;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3799, #27ae60);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--dark);
        }

        .container {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .header {
            border-bottom: 3px solid var(--primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #219150; transform: translateY(-2px); }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .level-card {
            background: var(--light);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #ddd;
            cursor: pointer;
        }

        .level-card.locked { opacity: 0.6; cursor: not-allowed; background: #eee; }
        .level-card.active { border-color: var(--primary); background: #eafff0; }

        .option {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            background: white;
            text-align: left;
            cursor: pointer;
            font-size: 1.1em;
        }

        .option:hover { border-color: var(--primary); background: #f0fff4; }
        #timer { font-weight: bold; color: var(--error); font-size: 1.2em; }

        .input-libre {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid var(--primary);
            border-radius: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <div class="header">
            <h1>🌍 Géographie Master</h1>
            <div id="player-info">Joueur: <strong id="current-player-name">---</strong></div>
        </div>
        
        <div class="lesson-box" id="lesson-display" style="background:#f0f7ff; padding:20px; border-radius:15px; margin-bottom:20px; display:none;">
            <h3 id="lesson-title" style="color:var(--primary)"></h3>
            <p id="lesson-text" style="margin:10px 0; line-height:1.5"></p>
            <button class="btn btn-primary" onclick="startQuiz()">Lancer le Quiz (10 questions)</button>
        </div>

        <h3>Choisissez votre niveau :</h3>
        <div class="level-grid" id="levels-container"></div>
    </div>

    <div id="quiz-zone" style="display:none;">
        <div class="header">
            <span id="progress">Question 1/10</span>
            <span id="timer">⏳ 20s</span>
        </div>
        <h2 id="question-text" style="margin-bottom:25px;"></h2>
        <div id="options-list"></div>
        <div id="libre-zone" style="display:none;">
            <input type="text" id="answer-input" class="input-libre" placeholder="Tape ta réponse ici...">
            <button class="btn btn-primary" onclick="checkLibre()">Valider</button>
        </div>
    </div>

    <div id="result-screen" style="display:none; text-align:center;">
        <h2 id="result-status">Bravo !</h2>
        <div style="font-size: 4em; margin: 20px 0;" id="final-score">0/10</div>
        <button class="btn btn-primary" onclick="location.reload()">Retour au menu</button>
    </div>
</div>

let state = {
    player: null,
    currentLevel: null,
    currentQuestions: [],
    index: 0,
    score: 0,
    timer: null,
    timeLeft: 20
};

function loadPlayer() {
    let players = JSON.parse(localStorage.getItem(SUBJECT_DATA.config.storageKey)) || {};
    let name = new URLSearchParams(window.location.search).get('player') || "Explorateur";
    
    if (!players[name]) {
        players[name] = { name: name, levelReached: 1 };
        localStorage.setItem(SUBJECT_DATA.config.storageKey, JSON.stringify(players));
    }
    state.player = players[name];
    document.getElementById('current-player-name').textContent = name;
    renderLevels();
}

function renderLevels() {
    const container = document.getElementById('levels-container');
    container.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
        const isLocked = i > state.player.levelReached;
        const div = document.createElement('div');
        div.className = `level-card ${isLocked ? 'locked' : 'active'}`;
        div.innerHTML = `<h4>Niveau ${i}</h4>${isLocked ? '🔒' : '🔓'}`;
        if (!isLocked) div.onclick = () => selectLevel(i);
        container.appendChild(div);
    }
}

function selectLevel(lvl) {
    state.currentLevel = lvl;
    const lesson = SUBJECT_DATA.lessons[lvl];
    document.getElementById('lesson-title').textContent = lesson.t;
    document.getElementById('lesson-text').textContent = lesson.c;
    document.getElementById('lesson-display').style.display = 'block';
}

function startQuiz() {
    const data = QUESTIONS_DB_GEO[state.currentLevel];
    // On mélange QCM et Libres pour faire 10 questions au total
    const pool = [
        ...data.qcm.map(q => ({...q, type: 'qcm'})),
        ...data.libre.map(q => ({...q, type: 'libre'}))
    ];
    state.currentQuestions = pool.sort(() => 0.5 - Math.random()).slice(0, 10);
    state.index = 0;
    state.score = 0;
    
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('quiz-zone').style.display = 'block';
    showQuestion();
}

function showQuestion() {
    if (state.index >= state.currentQuestions.length) return finishQuiz();
    
    const q = state.currentQuestions[state.index];
    document.getElementById('progress').textContent = `Question ${state.index + 1}/10`;
    document.getElementById('question-text').textContent = q.q;
    
    const list = document.getElementById('options-list');
    const libre = document.getElementById('libre-zone');
    list.innerHTML = '';
    
    if (q.type === 'qcm') {
        libre.style.display = 'none';
        list.style.display = 'block';
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(opt, q.correct);
            list.appendChild(btn);
        });
    } else {
        list.style.display = 'none';
        libre.style.display = 'block';
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').focus();
    }
    
    startTimer();
}

function checkLibre() {
    const input = document.getElementById('answer-input').value.trim().toLowerCase();
    const q = state.currentQuestions[state.index];
    const isCorrect = input === q.answer.toLowerCase() || (q.alternatives && q.alternatives.some(a => a.toLowerCase() === input));
    
    if (isCorrect) state.score++;
    next();
}

function checkAnswer(choice, correct) {
    if (choice === correct) state.score++;
    next();
}

function next() {
    clearInterval(state.timer);
    state.index++;
    showQuestion();
}

function startTimer() {
    state.timeLeft = 20;
    document.getElementById('timer').textContent = `⏳ ${state.timeLeft}s`;
    state.timer = setInterval(() => {
        state.timeLeft--;
        document.getElementById('timer').textContent = `⏳ ${state.timeLeft}s`;
        if (state.timeLeft <= 0) next();
    }, 1000);
}

function finishQuiz() {
    document.getElementById('quiz-zone').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').textContent = `${state.score}/10`;
    
    if (state.score >= 8) {
        document.getElementById('result-status').textContent = "Niveau Réussi ! 🎉";
        if (state.currentLevel === state.player.levelReached && state.player.levelReached < 5) {
            state.player.levelReached++;
            saveData();
        }
    } else {
        document.getElementById('result-status').textContent = "Presque... Il faut 8/10 ! ✌️";
    }
}

function saveData() {
    let players = JSON.parse(localStorage.getItem(SUBJECT_DATA.config.storageKey));
    players[state.player.name] = state.player;
    localStorage.setItem(SUBJECT_DATA.config.storageKey, JSON.stringify(players));
}
