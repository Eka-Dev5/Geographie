<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Géographie Master 🌍</title>
<style>
/* ═══════════════════════════════════════════
   SUJET CONFIG : GÉOGRAPHIE MASTER
   ═══════════════════════════════════════════ */
:root {
  --primary:#27ae60; --secondary:#229954; --success:#48bb78;
  --error:#f56565; --warning:#ed8936; --bg:#f7fafc; --text:#2d3748;
  --shadow:0 10px 30px rgba(0,0,0,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,sans-serif}
body{background:linear-gradient(135deg,var(--primary),var(--secondary));min-height:100vh;padding:15px}

.quiz-container{background:white;width:100%;max-width:820px;margin:0 auto;border-radius:20px;padding:25px;box-shadow:var(--shadow);position:relative;overflow:hidden}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #f0f2f5}
.header h1{font-size:1.8em;color:var(--primary);display:flex;align-items:center;gap:10px}

/* BOUTONS */
.btn{padding:10px 22px;border:none;border-radius:12px;cursor:pointer;font-weight:700;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-size:1em}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(39,174,96,0.3)}

/* LEÇON & QUESTIONS */
.lesson-card{background:#f0fff4;border-left:5px solid var(--primary);padding:20px;border-radius:12px;margin-bottom:25px;line-height:1.6}
.option-btn{width:100%;text-align:left;padding:16px 20px;margin-bottom:12px;border:2px solid #edf2f7;border-radius:15px;background:white;font-size:1.05em;cursor:pointer;transition:all .2s}
.option-btn:hover{border-color:var(--primary);background:#f0fff4;transform:translateX(5px)}

/* ÉCRANS */
#setup-screen, #quiz-screen, #result-screen { display: none; animation: fadeIn 0.4s ease-out; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<div class="quiz-container">
  <div class="header">
    <div>
      <h1 id="subject-title">🌍 Géographie Master</h1>
      <div id="player-badge" style="font-size:0.85em; color:var(--secondary); font-weight:bold; margin-top:4px">
        👤 Joueur : <span id="playerNameDisplay">-</span>
      </div>
    </div>
    <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">📊 Stats</button>
  </div>

  <div id="setup-screen" style="display:block">
    <div class="lesson-card">
      <h2 id="lesson-title" style="margin-bottom:10px; color:var(--primary)">Prêt pour la Géo ?</h2>
      <div id="lesson-content">Choisis un niveau pour commencer à apprendre et jouer.</div>
    </div>
    <div id="level-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:15px"></div>
  </div>

  <div id="quiz-screen">
    <div id="question-box">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px">
        <span id="progress-text" style="font-weight:bold; color:var(--primary)">Question 1/10</span>
        <span id="timer-text" style="color:var(--error); font-weight:bold">⏳ 20s</span>
      </div>
      <h2 id="question-text" style="margin-bottom:20px; min-height:60px">Chargement...</h2>
      <div id="options-container"></div>
    </div>
  </div>

  <div id="result-screen" style="text-align:center">
    <h2 id="result-title" style="font-size:2em; margin-bottom:10px">Résultat</h2>
    <div id="result-score" style="font-size:4em; font-weight:900; color:var(--primary); margin-bottom:15px">0/0</div>
    <p id="result-msg" style="margin-bottom:25px; color:#4a5568"></p>
    <button class="btn btn-primary" onclick="location.reload()">🏠 Continuer</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   🗃️ DATABASE GÉOGRAPHIE
   ═══════════════════════════════════════════ */
const SUBJECT_CONFIG = {
  storageKey: 'geoMaster_v1',
  playersKey: 'geoMaster_players',
  subjectName: 'Géographie Master'
};

const LESSONS_DATA = {
  1: { title: "La France : Territoire et Villes", content: "La France est le plus vaste pays de l'Union européenne. Elle est bordée par la Manche, l'Océan Atlantique et la Mer Méditerranée. Sa capitale est Paris." },
  2: { title: "Relief et Climats", content: "On trouve plusieurs massifs montagneux : les Alpes (Mont Blanc), les Pyrénées, le Massif Central. Les fleuves principaux sont la Loire, le Rhône, la Seine et la Garonne." },
  3: { title: "La France dans le Monde", content: "La France est présente partout grâce aux DROM-COM (Guadeloupe, Guyane, Réunion, etc.). C'est l'un des pays les plus visités au monde." }
};

const QUESTIONS_DATA = [
  // NIVEAU 1
  { level:1, question:"Quelle est la capitale de la France ?", options:["Marseille","Lyon","Paris"], answer:"Paris", explanation:"Paris est le siège du gouvernement." },
  { level:1, question:"Lequel de ces pays n'a PAS de frontière avec la France ?", options:["Italie","Espagne","Portugal"], answer:"Portugal", explanation:"Le Portugal ne touche pas la France." },
  { level:1, question:"Quelle mer borde le sud de la France ?", options:["La Mer Rouge","La Méditerranée","La Mer Noire"], answer:"La Méditerranée", explanation:"La Méditerranée borde la Côte d'Azur." },
  // NIVEAU 2
  { level:2, question:"Quel est le plus haut sommet des Alpes ?", options:["Le Mont Blanc","Le Canigou","Le Puy de Dôme"], answer:"Le Mont Blanc", explanation:"Il culmine à 4808 mètres." },
  { level:2, question:"Quel est le plus long fleuve de France ?", options:["La Seine","La Loire","La Garonne"], answer:"La Loire", explanation:"La Loire mesure 1006 km." },
  // NIVEAU 3
  { level:3, question:"Quel DROM est situé en Amérique du Sud ?", options:["La Martinique","La Guyane","La Réunion"], answer:"La Guyane", explanation:"La Guyane est limitrophe du Brésil." }
];

/* ═══════════════════════════════════════════
   🚀 MOTEUR TECHNIQUE (TRANSPLANTATION HISTOIRE)
   ═══════════════════════════════════════════ */
let currentPlayerName = "";
let currentLevel = 1;
let score = 0;
let qIdx = 0;
let activeQuestions = [];

function getPlayers() { return JSON.parse(localStorage.getItem(SUBJECT_CONFIG.playersKey)) || {}; }
function savePlayers(p) { localStorage.setItem(SUBJECT_CONFIG.playersKey, JSON.stringify(p)); }

function init() {
  const players = getPlayers();
  const params = new URLSearchParams(window.location.search);
  const urlPlayer = params.get('player');

  if (urlPlayer && players[urlPlayer]) {
    currentPlayerName = urlPlayer;
  } else {
    const names = Object.keys(players);
    if (names.length > 0) {
      currentPlayerName = names[0];
    } else {
      currentPlayerName = "Joueur 1";
      players[currentPlayerName] = { name: "Joueur 1", currentLevel: 1, score: 0, completed: [], totalQuestions: 0, totalCorrect: 0, streak: 0, errorHistory: [] };
      savePlayers(players);
    }
  }
  document.getElementById('playerNameDisplay').textContent = currentPlayerName;
  renderLevels();
}

function renderLevels() {
  const grid = document.getElementById('level-grid');
  grid.innerHTML = "";
  const p = getPlayers()[currentPlayerName];
  for (let i = 1; i <= 3; i++) {
    const isLocked = i > p.currentLevel;
    const btn = document.createElement('button');
    btn.className = `btn ${isLocked ? 'btn-locked' : 'btn-primary'}`;
    btn.innerHTML = `Niveau ${i} ${p.completed.includes(i) ? '✅' : ''}`;
    btn.disabled = isLocked;
    btn.onclick = () => { if(!isLocked) startLevel(i); };
    grid.appendChild(btn);
  }
}

function startLevel(lvl) {
  currentLevel = lvl;
  activeQuestions = QUESTIONS_DATA.filter(q => q.level === lvl);
  score = 0; qIdx = 0;
  
  const lesson = LESSONS_DATA[lvl];
  document.getElementById('lesson-title').textContent = lesson.title;
  document.getElementById('lesson-content').innerHTML = `<p>${lesson.content}</p><br><button class="btn btn-primary" onclick="launchQuiz()">C'est parti !</button>`;
}

function launchQuiz() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  const q = activeQuestions[qIdx];
  document.getElementById('progress-text').textContent = `Question ${qIdx + 1}/${activeQuestions.length}`;
  document.getElementById('question-text').textContent = q.question;
  const container = document.getElementById('options-container');
  container.innerHTML = "";
  
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option-btn';
    b.textContent = opt;
    b.onclick = () => check(opt, q.answer);
    container.appendChild(b);
  });
}

function check(choice, correct) {
  if (choice === correct) score++;
  qIdx++;
  if (qIdx < activeQuestions.length) showQuestion();
  else finish();
}

function finish() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  document.getElementById('result-score').textContent = `${score}/${activeQuestions.length}`;
  
  const pct = (score / activeQuestions.length) * 100;
  if (pct >= 80) {
    const players = getPlayers();
    const p = players[currentPlayerName];
    if (!p.completed.includes(currentLevel)) p.completed.push(currentLevel);
    if (currentLevel === p.currentLevel) p.currentLevel++;
    savePlayers(players);
    document.getElementById('result-msg').textContent = "Excellent ! Niveau réussi.";
  } else {
    document.getElementById('result-msg').textContent = "Dommage... Il faut 80% pour passer.";
  }
}

init();
</script>
</body>
</html>
