<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Géographie Master — Mon Espace</title>

  <style>
    /* 🎨 PALETTE GÉOGRAPHIE */
    :root {
      --primary  : #27ae60;
      --secondary: #229954;
      --success  : #48bb78;
      --error    : #f56565;
      --warning  : #ed8936;
      --gold     : #ffd700;
    }

    /* Reset & Layout identiques à Histoire */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
    body { background: linear-gradient(135deg, var(--primary), var(--secondary)); min-height: 100vh; padding: 15px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    
    /* Styles des boutons, onglets, badges, caméléon... (Identiques à ton fichier Histoire) */
    .btn { padding: 9px 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: all .2s; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 18px; border: none; background: #f0f0f0; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* ... (Suite du CSS identique au template Histoire) ... */
  </style>
</head>
<body>
<div class="container">

  <h1>🌍 Mon Espace Géographie Master</h1>
  <div class="subtitle">Tous tes progrès, badges et révisions en un coup d'œil</div>

  <div class="player-header no-print" style="display:flex; gap:10px; margin-bottom:20px; background:#f8f9fa; padding:15px; border-radius:15px;">
    <input type="text" id="newPlayerName" placeholder="Nom du nouveau joueur" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;">
    <button class="btn btn-primary" onclick="addPlayer()">➕ Créer</button>
  </div>

  <div class="player-header no-print">
    <select id="playerSelect" onchange="loadPlayer(this.value)">
      <option value="">-- Choisir un joueur --</option>
    </select>
    <button class="btn btn-primary" onclick="goToQuiz()">🎮 Quiz</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showTab('stats',this)">📈 Statistiques</button>
    <button class="tab-btn" onclick="showTab('badges',this)">🏅 Badges</button>
    <button class="tab-btn" onclick="showTab('cameleon',this)">🎭 Caméléon</button>
    <button class="tab-btn" onclick="showTab('fiches',this)">📝 Mes Fiches</button>
  </div>

  <div id="stats" class="tab-content active">
    <div id="levelBars"></div>
  </div>

</div>

<script>
  // CONFIGURATION GÉOGRAPHIE
  const STORAGE_KEY = "geoMaster_v1";
  const PLAYERS_KEY = "geoMaster_players";

  const LEVEL_NAMES = {
    1: "La France 🗺️",
    2: "L'Europe 🇪🇺",
    3: "Le Monde 🌏"
  };

  // Les fonctions JS sont les COPIES EXACTES de Histoire mais pointent sur geoMaster
  function getPlayers() { return JSON.parse(localStorage.getItem(PLAYERS_KEY)) || {}; }
  function savePlayers(p) { localStorage.setItem(PLAYERS_KEY, JSON.stringify(p)); }

  function addPlayer() {
    const name = document.getElementById('newPlayerName').value.trim();
    if (!name) return;
    const players = getPlayers();
    if (players[name]) return alert("Déjà existant");
    players[name] = {
      name: name, currentLevel: 1, score: 0, completed: [],
      totalQuestions: 0, totalCorrect: 0, streak: 0,
      errorHistory: [], cameleonHelped: 0
    };
    savePlayers(players);
    loadPlayerList();
  }

  // ... (Toutes les autres fonctions : renderBadges, renderCameleon, etc. à copier d'Histoire)
</script>
</body>
</html>
